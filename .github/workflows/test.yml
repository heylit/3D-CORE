# GitHub Actions - kendi Windows runner'ımızda (self-hosted), bulut dakikası harcamaz
# Ana kontrol yerelde (pre-commit, pre-push, ci.ps1). Burası sadece son bağımsız kapı.
# Çalıştığı durumlar:  main'e açılan PR  +  Actions sekmesinden elle "Run workflow"
# main'e doğrudan push CI TETİKLEMEZ (zaten pre-push hook'undan geçmiştir).

name: testler

on:
  pull_request:
    branches: [main]
    paths-ignore:            # sadece belge değişirse çalışma
      - "**.md"
      - "docs/**"
      - "specs/**"
  workflow_dispatch:         # elle çalıştırma

concurrency:                 # aynı PR'a yeni push gelirse eski çalışmayı iptal et
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: cmd   # Windows runner'da PowerShell betik çalıştırma kapalı (ExecutionPolicy); Linux adımları bash'i açıkça seçer

jobs:
  pytest:
    runs-on: self-hosted     # kendi Windows makinemiz; adımlar Linux runner'da da çalışır
    timeout-minutes: 30      # takılan test runner'ı kilitlemesin (tek runner, PR'lar sırayla)
    env:
      PYTHONUTF8: "1"        # Windows konsolunda Türkçe karakterler
      UV_PYTHON: "3.12"      # tek sürüm = tek iş
    steps:
      - uses: actions/checkout@v4
      - name: uv kur (Windows)  # setup-uv eylemi Windows'ta Node 24 çıkış hatasıyla çöküyor; doğrudan indir
        if: runner.os == 'Windows'
        run: |
          set "UVDIR=%RUNNER_TOOL_CACHE%\uv-0.13.1"
          if not exist "%UVDIR%\uv.exe" (
            curl -fsSL -o "%RUNNER_TEMP%\uv.zip" https://github.com/astral-sh/uv/releases/download/0.13.1/uv-x86_64-pc-windows-msvc.zip || exit /b 1
            mkdir "%UVDIR%"
            tar -xf "%RUNNER_TEMP%\uv.zip" -C "%UVDIR%" || exit /b 1
          )
          >> "%GITHUB_PATH%" echo %UVDIR%
      - uses: astral-sh/setup-uv@v6   # Linux runner için
        if: runner.os != 'Windows'
      - name: .venv kur ve etkinleştir (Windows)  # runner'da sistem Python'u yok: uv indirir
        if: runner.os == 'Windows'
        run: |
          uv venv .venv || exit /b 1
          >> "%GITHUB_PATH%" echo %CD%\.venv\Scripts
          >> "%GITHUB_ENV%" echo VIRTUAL_ENV=%CD%\.venv
      - name: .venv kur ve etkinleştir (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Ekransız çizim kütüphaneleri (Linux)  # SPEC 15 pyvista OSMesa, SPEC 12 gmsh wheel'i
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libosmesa6 libglu1-mesa libxcursor1 libxinerama1 libxft2
          echo "VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow" >> "$GITHUB_ENV"
      - name: CalculiX (ccx) kur (Linux)  # Windows'ta ccx PATH'te değilse tests/reference/test_calculix.py atlanır
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y --no-install-recommends calculix-ccx
      - run: uv pip install -e ".[dev,cad,viz,web,mesh]"   # web: SPEC 24 Tezgah, mesh: gmsh (SPEC 12)
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -rs --uygulanmamis-hata   # -rs: atlanan testler ve nedenleri logda; NotImplementedError PR'da kırmızı (conftest.py)
      - name: LinuxCNC rs274 çapraz kontrolü  # Debian kapsayıcısında; Windows runner'da Docker/Linux yok, atlanır
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              linuxcnc-uspace python3-numpy python3-scipy python3-pytest > /dev/null
            command -v rs274
            python3 -m pytest -rs -p no:cacheprovider --uygulanmamis-hata \
              tests/reference/test_gcode_crosscheck.py -k rs274
          '
