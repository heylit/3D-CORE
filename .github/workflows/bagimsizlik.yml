# Test bağımsızlığı kapısı (CLAUDE.md "Test bağımsızlığı"; scripts/bagimsizlik_kapisi.py).
# Aynı Claude oturumu bir PR'da hem testleri hem kodu değiştirdiyse kırmızı.
# Sadece git geçmişini okur: kurulum yok (uv yalnız Python'u getirir), ~15 sn. Etiket olayları istisna etiketi için tetikler.

name: bagimsizlik

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kapi:
    runs-on: self-hosted   # kendi Windows makinemiz; runner'da git PATH'te olmalı (geçmiş için)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0     # commit izleri (Claude-Session) için tüm geçmiş
      - uses: astral-sh/setup-uv@v6   # runner'da sistem Python'u yok: uv getirir
        with:
          python-version: "3.12"
      - name: Test bağımsızlığı
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
          PR_NUMARASI: ${{ github.event.pull_request.number }}
        run: >
          uv run --no-project python scripts/bagimsizlik_kapisi.py
          --taban ${{ github.event.pull_request.base.sha }}
          --uc ${{ github.event.pull_request.head.sha }}
