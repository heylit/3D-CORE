# Test bağımsızlığı kapısı (CLAUDE.md "Test bağımsızlığı"; scripts/bagimsizlik_kapisi.py).
# Aynı Claude oturumu bir PR'da hem testleri hem kodu değiştirdiyse kırmızı.
# Sadece git geçmişini okur: kurulum yok, ~15 sn. Etiket olayları istisna etiketi için tetikler.

name: bagimsizlik

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  kapi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0     # commit izleri (Claude-Session) için tüm geçmiş
      - name: Test bağımsızlığı
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMARASI: ${{ github.event.pull_request.number }}
        run: >
          python3 scripts/bagimsizlik_kapisi.py
          --taban ${{ github.event.pull_request.base.sha }}
          --uc ${{ github.event.pull_request.head.sha }}
