[project]
name = "3d-core"
version = "0.1.0"
description = "3D CAM ve montaj sistemi; OCCT tabanlı katı altyapı ve kendi FEM çözücüsü"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.60",  # SPEC 53: 5 eksen simülasyonu döngüleri (core/ kullanmaz)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-html>=4", "ruff==0.17.1", "httpx>=0.27", "pytest-xdist>=3.5"]
viz = ["matplotlib>=3.8", "pyvista>=0.43"]
mesh = ["gmsh>=4.11"]
cad = ["build123d>=0.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]  # SPEC 24 Tezgah

[project.scripts]
tezgah = "tezgah.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "geometry*", "cam*", "assy*", "sketch*", "mesh*", "fileio*", "viz*", "tezgah*", "atolye*", "analiz*", "malzeme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: uzun süren testler (pre-commit'te atlanır, pre-push ve ci.ps1'de çalışır)",
    "occt: build123d / OpenCascade gerektirir (kurulu değilse atlanır)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Paketlerimizi açıkça bildir: yoksa ruff, dalda henüz olmayan alt modülü (ör. cam.plan_turn)
# üçüncü taraf sayar ve import sırası dala göre değişir.
[tool.ruff.lint.isort]
known-first-party = [
    "core", "geometry", "cam", "assy", "sketch", "mesh", "fileio", "viz", "tezgah", "atolye", "analiz", "malzeme",
]
